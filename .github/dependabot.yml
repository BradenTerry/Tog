# Keeps the pinned things current: the NuGet lock files, the lockfiles in
# tools/vendor (the ACP bridge, Monaco, Mermaid and the TextMate grammars) and
# tools/screenshots (Playwright), and the commit each GitHub Action is pinned
# to. Not the .NET SDK: global.json is a floor that takes any .NET 10 SDK, and
# the exact one CI builds with is DOTNET_SDK in ci.yml, moved by hand with the
# lock files, since the web SDK's implicit packages follow it.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /tools/vendor/acp
      - /tools/vendor/monaco
      - /tools/vendor/mermaid
      - /tools/vendor/textmate
      - /tools/screenshots
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
