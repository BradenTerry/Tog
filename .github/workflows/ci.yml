name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit, with the release it is in a comment, so
# a moved tag cannot change what runs here. Dependabot keeps them current.
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version is the newest v* tag and the commits since it
          # (Directory.Build.targets), which a shallow clone has not got.
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The build vendors Monaco, Mermaid, the TextMate grammars and the ACP
      # bridge with Node scripts in tools/.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Locked mode: the committed packages.lock.json files are what is
      # restored, and a reference that would resolve differently fails here
      # rather than changing the build.
      - name: Restore
        run: dotnet restore Togue.slnx --locked-mode

      - name: Build
        run: dotnet build Togue.slnx --no-restore

      # Never --nologo: in Microsoft.Testing.Platform mode it is forwarded to the
      # test application, which rejects it and reports zero tests. --long-running
      # names a test that hangs while it hangs, and --timeout ends the run, so a
      # hang fails with the culprit in the log instead of eating the job's hours.
      - name: Test
        run: dotnet test Togue.slnx --no-build --report-trx --results-directory TestResults --long-running 60 --timeout 10m

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
